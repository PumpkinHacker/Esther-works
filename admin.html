<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Esther World Admin</title><style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:24px 14px;background:linear-gradient(135deg,#fff1f8,#edf5ff,#f4eeff);font:16px/1.45 system-ui,-apple-system,sans-serif;color:#30304a}.ew-admin-card{max-width:680px;margin:auto;background:#fff;border:2px solid #e7dcff;border-radius:22px;padding:22px;box-shadow:0 12px 36px #55408018}.ew-admin-card header{display:flex;align-items:center;justify-content:space-between;gap:10px}.ew-admin-card h2{margin:0;font-size:1.5rem}.ew-admin-card p{color:#66627d}.ew-admin-card label{display:block;font-weight:650;margin:15px 0}.ew-admin-card input,.ew-admin-card textarea{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #cfc7e6;border-radius:10px;font:inherit}.ew-admin-card button{border:0;border-radius:12px;padding:12px 16px;background:#7550ce;color:#fff;font-weight:700;font:inherit;cursor:pointer}.ew-admin-card button:focus-visible,.ew-admin-card input:focus-visible,.ew-admin-card textarea:focus-visible{outline:3px solid #ff9ccc;outline-offset:2px}.ew-admin-card hr{border:0;border-top:1px solid #eee7fa;margin:22px 0}.ew-admin-card code{overflow-wrap:anywhere}.ew-admin-card li{margin:9px 0;overflow-wrap:anywhere}#ew-status{min-height:1.5em}</style></head><body><main id="esther-admin-root"></main><script src="config.js"></script><script>window.ESTHER_ADMIN_API=window.ESTHER_WORLD_API||'';</script><script src="admin.js"></script></body></html>
